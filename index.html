<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成語填空大挑戰 - 全球排行榜版</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./favicon.png">

    <!-- Social Sharing (Open Graph) -->
    <meta property="og:title" content="成語填空大挑戰 - 全球排行榜版">
    <meta property="og:description" content="挑戰成語知識，爭取全球排行榜最高榮譽！豐富音效與特效，學習也可以很有趣。">
    <meta property="og:image" content="./og-image.png">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://cagoooo.github.io/typeTC/">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+TC:wght@400;500;700&display=swap"
        rel="stylesheet">

    <!-- SEO -->
    <meta name="description" content="一個專為學生設計的互動式成語學習遊戲，具有豐富音效與視覺回饋，快來挑戰！">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#991b1b">

    <!-- 引入自訂 CSS 會由 Vite 處理 Tailwind 的編譯 -->
    <link rel="stylesheet" href="./src/style.css">

    <!-- 註冊 Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                // 僅在生產環境或非本地網域註冊
                if (!window.location.hostname.includes('localhost') && !window.location.hostname.includes('127.0.0.1')) {
                    navigator.serviceWorker.register('./sw.js')
                        .then(reg => console.log('[PWA] Service Worker 註冊成功:', reg.scope))
                        .catch(err => console.log('[PWA] Service Worker 註冊失敗:', err));
                } else {
                    // 開發環境下主動取消註冊，防止快取干擾 Vite HMR
                    navigator.serviceWorker.getRegistrations().then(registrations => {
                        for (let registration of registrations) {
                            registration.unregister();
                            console.log('[PWA] 開發環境：已取消註冊 Service Worker');
                        }
                    });
                }
            });
        }
    </script>

    <!-- Firebase 配置佔位符 (由 .github/inject.py 在部署時替換) -->
    <script>
        window.FIREBASE_CONFIG = {
            apiKey: "__VITE_FIREBASE_API_KEY__",
            authDomain: "__VITE_FIREBASE_AUTH_DOMAIN__",
            projectId: "__VITE_FIREBASE_PROJECT_ID__",
            storageBucket: "__VITE_FIREBASE_STORAGE_BUCKET__",
            messagingSenderId: "__VITE_FIREBASE_MESSAGING_SENDER_ID__",
            appId: "__VITE_FIREBASE_APP_ID__"
        };

        // 強效清除：避免舊版 Service Worker 殘留導致 404 錯誤
        (function () {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function (registrations) {
                    for (let registration of registrations) {
                        registration.unregister().then(() => {
                            console.log('Old SW unregistered');
                            if (window.localStorage.getItem('sw_cleaned') !== 'true') {
                                window.localStorage.setItem('sw_cleaned', 'true');
                                window.location.reload();
                            }
                        });
                    }
                });
            }
        })();
    </script>
</head>

<body class="bg-stone-50 min-h-screen flex items-center justify-center p-4 font-notoSans relative overflow-x-hidden">

    <!-- 櫻花特效畫布 -->
    <canvas id="sakura-canvas" class="fixed inset-0 pointer-events-none -z-10"></canvas>

    <!-- 背景裝飾層 -->
    <div class="fixed inset-0 -z-20 bg-oriental-pattern opacity-10 pointer-events-none"></div>

    <!-- 音效與音樂控制 (右上角) -->
    <div class="fixed top-4 right-4 z-50 flex space-x-2">
        <button id="bgm-toggle"
            class="bg-white/80 backdrop-blur-sm p-2 rounded-full shadow-lg border border-red-100 hover:bg-red-50 transition-all group"
            title="開啟/關閉音樂">
            <svg id="music-on-icon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-red-700" fill="none"
                viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" />
            </svg>
            <svg id="music-off-icon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-400 hidden" fill="none"
                viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
            </svg>
        </button>
        <button id="bgm-next"
            class="bg-white/80 backdrop-blur-sm p-2 rounded-full shadow-lg border border-red-100 hover:bg-red-50 transition-all hidden"
            title="下一首">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-red-700" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7" />
            </svg>
        </button>
    </div>

    <div
        class="w-full max-w-2xl bg-white/90 backdrop-blur-md rounded-3xl shadow-2xl overflow-hidden border border-white/20 transition-all duration-500">
        <div class="p-6 sm:p-10">
            <div class="flex flex-col sm:flex-row justify-between items-center mb-8 gap-4">
                <h1
                    class="text-3xl sm:text-4xl font-bold bg-gradient-to-r from-red-800 to-red-600 bg-clip-text text-transparent title-font">
                    成語填空大挑戰</h1>
                <div class="flex items-center space-x-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-red-500" fill="currentColor"
                        viewBox="0 0 24 24" id="lives-icon">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
                    </svg>
                    <span id="lives" class="text-xl font-bold text-red-500 mr-4">3</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-yellow-500" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z">
                        </path>
                    </svg>
                    <span id="score" class="text-xl font-bold text-gray-800">0</span>
                </div>
            </div>

            <div id="difficulty-selector"
                class="mb-6 bg-red-50/50 p-6 rounded-2xl text-center border border-red-100/50 shadow-inner">
                <h2 class="text-lg font-bold text-red-900 mb-4 title-font">請選擇難度以開始遊戲：</h2>
                <div class="flex flex-wrap justify-center gap-3 sm:gap-4">
                    <button
                        class="diff-btn btn bg-red-100 text-red-800 font-bold py-2.5 px-6 rounded-xl hover:bg-red-200 transition-all"
                        data-time="20" onclick="startAtmosphere()">簡單 (20秒)</button>
                    <button
                        class="diff-btn btn bg-amber-100 text-amber-800 font-bold py-2.5 px-6 rounded-xl hover:bg-amber-200 transition-all"
                        data-time="15" onclick="startAtmosphere()">一般 (15秒)</button>
                    <button
                        class="diff-btn btn bg-slate-800 text-white font-bold py-2.5 px-6 rounded-xl hover:bg-slate-900 transition-all"
                        data-time="10" onclick="startAtmosphere()">困難 (10秒)</button>
                </div>
                <div class="mt-6">
                    <button id="show-leaderboard-btn"
                        class="text-red-700 hover:text-red-900 font-bold flex items-center justify-center mx-auto transition-all group">
                        <svg xmlns="http://www.w3.org/2000/svg"
                            class="h-5 w-5 mr-1 group-hover:scale-110 transition-transform" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                        </svg>
                        查看榮譽排行榜
                    </button>
                </div>
            </div>

            <div id="game-area" class="hidden">
                <div class="mb-6">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-xs sm:text-sm font-medium text-gray-600">剩餘時間</span>
                        <span id="timer" class="text-xs sm:text-sm font-medium text-gray-600">0</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2">
                        <div id="timer-bar" class="timer-bar w-full"></div>
                    </div>
                </div>

                <div id="game-container" class="mb-8 relative">
                    <div class="flex justify-center space-x-2 sm:space-x-3 md:space-x-4 mb-4">
                        <div id="char1"
                            class="idiom-character w-12 h-12 text-xl sm:w-14 sm:h-14 sm:text-2xl md:w-[60px] md:h-[60px] md:text-[28px] font-medium">
                        </div>
                        <div id="char2"
                            class="idiom-character w-12 h-12 text-xl sm:w-14 sm:h-14 sm:text-2xl md:w-[60px] md:h-[60px] md:text-[28px] font-medium">
                        </div>
                        <div id="char3"
                            class="idiom-character w-12 h-12 text-xl sm:w-14 sm:h-14 sm:text-2xl md:w-[60px] md:h-[60px] md:text-[28px] font-medium">
                        </div>
                        <div id="char4"
                            class="idiom-character w-12 h-12 text-xl sm:w-14 sm:h-14 sm:text-2xl md:w-[60px] md:h-[60px] md:text-[28px] font-medium">
                        </div>
                    </div>

                    <!-- 點擊查看提示 -->
                    <p id="dict-hint" class="text-center text-[10px] text-gray-400 mb-6 hidden animate-pulse">
                        💡 點擊上方文字查看詳細釋義與注音
                    </p>

                    <div class="mb-6">
                        <label htmlFor="answer"
                            class="block text-sm font-medium text-gray-700 mb-2 cursor-pointer">請填入缺少的字：</label>
                        <div class="flex">
                            <input type="text" id="answer"
                                class="flex-1 px-4 py-2 border border-gray-300 rounded-l-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-lg"
                                maxlength="1" autocomplete="off">
                            <button id="submit-btn"
                                class="btn bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-r-md">
                                確定
                            </button>
                        </div>
                    </div>

                    <div id="feedback" class="text-center text-lg font-medium mb-2 hidden"></div>
                    <!-- 成語解釋顯示區 -->
                    <div id="meaning-box"
                        class="bg-blue-50 border border-blue-200 rounded-lg p-3 text-sm text-blue-800 text-center mb-4 hidden animate-pop">
                    </div>
                </div>

                <div class="flex justify-center mt-4 space-x-4">
                    <button id="next-btn"
                        class="btn bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded-md hidden">
                        下一題
                    </button>
                    <button id="restart-btn"
                        class="btn bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-6 rounded-md">
                        回首頁
                    </button>
                </div>
            </div>

            <div id="game-over-area" class="hidden text-center mt-12 pb-8">
                <h2 class="text-4xl font-bold text-red-800 mb-4 title-font">遊戲結束！</h2>
                <p class="text-xl text-slate-700 mb-6 font-medium">您的最終得分為：<span id="final-score"
                        class="font-bold text-amber-600 text-4xl">0</span></p>

                <div id="nickname-section"
                    class="mb-8 bg-amber-50/50 p-8 rounded-3xl border border-amber-100 shadow-sm transition-all">
                    <p class="text-amber-900 mb-4 font-bold flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1 text-amber-600" viewBox="0 0 20 20"
                            fill="currentColor">
                            <path
                                d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
                        </svg>
                        恭喜打破紀錄！請留下您的名號：
                    </p>
                    <div class="flex max-w-sm mx-auto shadow-lg rounded-2xl overflow-hidden border-2 border-amber-200">
                        <input type="text" id="nickname-input"
                            class="flex-1 px-6 py-3 bg-white focus:outline-none text-center font-bold text-lg text-slate-800"
                            placeholder="您的暱稱" maxlength="10">
                        <button id="upload-score-btn"
                            class="bg-red-700 hover:bg-red-800 text-white font-bold py-3 px-8 transition-colors">
                            上傳
                        </button>
                    </div>
                    <p id="upload-status" class="mt-4 text-sm font-medium hidden"></p>
                </div>

                <div class="flex flex-col sm:flex-row justify-center space-y-3 sm:space-y-0 sm:space-x-4">
                    <button id="play-again-btn"
                        class="btn bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg shadow-lg transform transition active:scale-95">
                        再玩一次
                    </button>
                    <button id="view-leaderboard-btn"
                        class="btn bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-3 px-8 rounded-lg shadow-lg transform transition active:scale-95">
                        排行榜
                    </button>
                </div>
            </div>

            <!-- 排行榜彈窗 -->
            <div id="leaderboard-modal"
                class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm hidden">
                <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden animate-pop">
                    <div
                        class="bg-gradient-to-r from-red-800 to-red-600 p-5 text-white flex justify-between items-center shadow-lg">
                        <h3 class="text-xl font-bold flex items-center title-font tracking-wider">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                            </svg>
                            榮譽排行榜 (TOP 10)
                        </h3>
                        <button id="close-leaderboard-btn" class="text-white/80 hover:text-white">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>
                    </div>
                    <div class="p-6 max-h-[60vh] overflow-y-auto">
                        <table class="w-full text-left">
                            <thead class="border-b-2 border-gray-100">
                                <tr>
                                    <th class="py-3 px-2 font-bold text-gray-600">排名</th>
                                    <th class="py-3 px-2 font-bold text-gray-600">暱稱</th>
                                    <th class="py-3 px-2 font-bold text-gray-600 text-right">分數</th>
                                </tr>
                            </thead>
                            <tbody id="leaderboard-body" class="divide-y divide-gray-50">
                                <!-- 動態載入 -->
                                <tr>
                                    <td colspan="3" class="py-8 text-center text-gray-400 italic">載入中...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="bg-gray-50 p-4 text-center">
                        <p class="text-xs text-gray-400">僅顯示全域前 10 名的高分紀錄</p>
                    </div>
                </div>
            </div>

        </div>
    </div>
    <!-- 成語辭典彈窗 (Dictionary Popover) -->
    <div id="dict-modal" class="dictionary-modal hidden">
        <div
            class="bg-white/95 backdrop-blur-xl rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden animate-pop border border-red-100 p-0">
            <div class="bg-red-800 p-4 text-white flex justify-between items-center">
                <h3 class="font-bold title-font tracking-widest text-lg" id="dict-title">成語詳解</h3>
                <button id="close-dict-btn" class="text-white/80 hover:text-white transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div class="p-6">
                <div class="mb-4">
                    <div class="flex items-baseline space-x-2 mb-1">
                        <span class="text-2xl font-bold text-red-900 title-font" id="dict-idiom"></span>
                        <span class="text-sm zhuyin-text" id="dict-zhuyin"></span>
                    </div>
                </div>
                <div class="space-y-4">
                    <div>
                        <h4 class="text-xs font-bold text-red-700 uppercase tracking-wider mb-1">【釋義】</h4>
                        <p class="text-gray-700 text-sm leading-relaxed" id="dict-meaning"></p>
                    </div>
                    <div>
                        <h4 class="text-xs font-bold text-red-700 uppercase tracking-wider mb-1">【例句】</h4>
                        <p class="text-gray-600 text-sm italic leading-relaxed" id="dict-example"></p>
                    </div>
                </div>
            </div>
            <div class="bg-red-50 p-3 text-center border-t border-red-100">
                <p class="text-[10px] text-red-800/60 font-medium">溫故而知新，可以為師矣</p>
            </div>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>

</html>
